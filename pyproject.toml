[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bola"
version = "0.1.0"
description = "Orchestrate local-LLM (Ollama) agent sessions with small context windows over any project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bola = "bola.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
